name: Patch CS3

on:
  workflow_dispatch:
    inputs:
      only:
        description: "Tek dosya adi (bos = hepsi)"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: patch-cs3
  cancel-in-progress: false

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: "17" }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }

      - name: Hazirlik
        run: |
          mkdir -p builds logs
          : > logs/patch.log

      - name: smali araçları (Maven)
        run: |
          mkdir -p tools/lib
          cat > pom.xml <<'POM'
          <project xmlns="http://maven.apache.org/POM/4.0.0"><modelVersion>4.0.0</modelVersion>
          <groupId>x</groupId><artifactId>x</artifactId><version>1</version>
          <dependencies>
          <dependency><groupId>org.smali</groupId><artifactId>smali</artifactId><version>2.5.2</version></dependency>
          <dependency><groupId>org.smali</groupId><artifactId>baksmali</artifactId><version>2.5.2</version></dependency>
          </dependencies></project>
          POM
          mvn -q dependency:copy-dependencies -DoutputDirectory=tools/lib

      - name: helper.dex derle
        run: |
          SDK=${ANDROID_HOME:-$ANDROID_SDK_ROOT}
          AJ=$(ls -d $SDK/platforms/android-*/android.jar | sort -V | tail -1)
          D8=$(ls -d $SDK/build-tools/*/d8 | sort -V | tail -1)
          mkdir -p build/classes
          # sadece helper/ altindaki dosyalar (eski helper/src kalintilari yok sayilir)
          SRC=$(find helper -maxdepth 1 -name '*.java')
          echo "kaynaklar: $SRC"
          if ! javac --release 8 -cp "$AJ" -d build/classes $SRC > build/javac.log 2>&1; then
            { echo "HATA: javac"; cat build/javac.log; } | tee -a logs/patch.log
            exit 1
          fi
          if ! "$D8" --min-api 21 --lib "$AJ" --output build $(find build/classes -name '*.class') > build/d8.log 2>&1; then
            { echo "HATA: d8"; cat build/d8.log; } | tee -a logs/patch.log
            exit 1
          fi
          mv build/classes.dex helper.dex

      # sites.json: {"Provider.cs3": "https://eski-domain.com"}
      - name: Yamala
        id: patch
        env:
          ONLY: ${{ github.event.inputs.only }}
        run: |
          set -o pipefail
          mkdir -p builds logs
          fail=0
          for f in input/*.cs3; do
            [ -e "$f" ] || continue
            name=$(basename "$f")
            if [ -n "$ONLY" ] && [ "$name" != "$ONLY" ]; then continue; fi
            old=$(jq -r --arg n "$name" '.[$n] // empty | if type=="array" then join(" ") else . end' sites.json)
            echo "== $name | domain: ${old:-yok}" | tee -a logs/patch.log
            if [ -z "$old" ]; then
              echo "ATLANDI: sites.json icinde kayit yok" | tee -a logs/patch.log
              continue
            fi
            args=()
            for d in $old; do args+=(--domain "$d"); done
            if ! python patch_cs3.py "$f" "${args[@]}" -o "builds/$name" 2>&1 | tee -a logs/patch.log; then
              fail=1
            fi
          done
          echo "fail=$fail" >> "$GITHUB_OUTPUT"

      - name: Commit
        if: always()
        run: |
          git config user.name "cs3-bot"
          git config user.email "bot@users.noreply.github.com"
          git add builds logs
          git commit -m "Patched CS3" || echo "no changes"
          git push

      - name: Sonuc
        if: steps.patch.outputs.fail == '1'
        run: exit 1
